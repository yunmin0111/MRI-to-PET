# PET-only VQGAN (Cor2Vox MRI->PET extension)
# Same architecture as c2v_vqgan_v2 (MRI); data swapped to PET.
# PET volumes are already 128^3 and already [-1,1] (global fixed SUVR scale).
data:
  dataset_type: 'pet_vqgan'
  dataset_config:
    img_folder: '/data/yunmin0111/dataset_pet_c2v/pet'   # -> petTr / petVal / petTs
    input_size: 128
    depth_size: 128
model:
  model_name: "c2v_vqgan_pet"
  vqgan:
    embedding_dim: 4
    num_embeddings: 1024
    base_channels: 32
    commitment_cost: 0.25
    disc_weight: 0.5
    perceptual_weight: 0.01
    n_slices: 8
    lr: 1.0e-4
    epochs: 100
